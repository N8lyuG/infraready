# Inventaire InfraReady (conventions du support S4 : groupe "linux").
# Aucun secret ici : connexion par cle SSH (agent), mot de passe sudo fourni a l'execution (-K).
[linux]
LINUX01 ansible_host=192.168.50.20

[linux:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519_lab
ansible_python_interpreter=/usr/bin/python3

# Windows : WinRM HTTP 5985 + NTLM (messages chiffres par NTLM ; HTTPS 5986 = amelioration S7).
# Mot de passe de svc_ansible demande a l'execution (-k), jamais stocke ici.
[windows]
WIN-DC01 ansible_host=192.168.50.10

[windows:vars]
ansible_connection=winrm
ansible_user=svc_ansible@infraready.test
ansible_port=5985
ansible_winrm_scheme=http
ansible_winrm_transport=ntlm
