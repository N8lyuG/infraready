---
# Inventaire InfraReady (remplace inventory.ini des seances 3-4).
# Aucun secret ici : cle SSH chargee dans ssh-agent, mots de passe sudo/WinRM saisis a l'execution
# (-K / -k) ou chiffres avec Ansible Vault (voir docs/securite.md).
all:
  children:
    linux:                 # serveurs Linux administres a distance par SSH
      hosts:
        LINUX01:
          ansible_host: 192.168.50.20
    supervision:           # poste d'administration : Ansible, Prometheus, Grafana (execution locale)
      hosts:
        OPS01:
          ansible_host: 192.168.50.30
          ansible_connection: local
    windows:
      hosts:
        WIN-DC01:
          ansible_host: 192.168.50.10
