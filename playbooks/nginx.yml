---
# nginx.yml - InfraReady (S4 etape 7 / cours 3) : serveur web Nginx sur le groupe linux.
# Lancement (depuis le dossier du projet sur OPS01, agent SSH charge) :
#   ansible-playbook -i inventory.ini nginx.yml --syntax-check
#   ansible-playbook -i inventory.ini nginx.yml --check --diff -K   # simulation (limite : service absent avant installation)
#   ansible-playbook -i inventory.ini nginx.yml -K                  # -K = mot de passe sudo du compte ansible
# Idempotence verifiee : 1er lancement changed=3, 2e lancement changed=0 (preuves S04_15 / S04_16).
- name: Configurer le serveur web InfraReady
  hosts: linux
  become: true
  vars:
    paquet_web: nginx
    service_web: nginx
    site_message: "Bienvenue sur le serveur web InfraReady"

  tasks:
    - name: Installer Nginx
      ansible.builtin.apt:
        name: "{{ paquet_web }}"
        state: present
        update_cache: true
        cache_valid_time: 3600      # evite un "changed" a chaque passage (idempotence)

    - name: Deployer la page du site
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
      notify: Recharger nginx       # handler declenche uniquement si la page change

    - name: Demarrer et activer Nginx
      ansible.builtin.service:
        name: "{{ service_web }}"
        state: started
        enabled: true

  handlers:
    - name: Recharger nginx
      ansible.builtin.service:
        name: "{{ service_web }}"
        state: reloaded
