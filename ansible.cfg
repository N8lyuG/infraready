# ansible.cfg - lu automatiquement quand on lance ansible depuis la racine du depot.
[defaults]
inventory = inventory/hosts.yml
host_key_checking = True          ; on garde la verification des cles d'hote SSH (anti-MITM)
retry_files_enabled = False
stdout_callback = default
result_format = yaml              ; sortie lisible pour les preuves
interpreter_python = auto_silent

[ssh_connection]
pipelining = True                 ; moins de connexions SSH par tache
